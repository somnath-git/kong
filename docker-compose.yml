# Minimal setup: browser -> Kong (DB-less) -> C# Web API.
# No database, no auth, no migrations. Just routing.
#
#   GET http://localhost:8000/api/hello  ->  Kong  ->  webapi:8080/hello
#
# Pinned images for reproducibility.

services:
  # --- C# Web API (static data) ---
  webapi:
    build: ./webapi
    # Published so you can hit the API directly for debugging, bypassing Kong:
    #   http://localhost:5000/hello
    # In a real gateway setup you'd normally REMOVE this and force all traffic through Kong.
    ports:
      - "5000:8080" # host 5000 -> container 8080
    networks:
      - kong-net

  # --- Kong Gateway in DB-less mode ---
  kong:
    image: kong:3.6
    environment:
      KONG_DATABASE: "off" # DB-less: config comes from the YAML file below
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
    volumes:
      - ./kong/kong.yml:/kong/kong.yml:ro
    ports:
      - "8000:8000" # proxy — send API traffic here
      - "8001:8001" # Admin API — read-only in DB-less mode, handy for inspecting config
    depends_on:
      - webapi
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - kong-net

networks:
  kong-net:
    driver: bridge
